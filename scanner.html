<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>QRスキャナ（Surface用・連続読み取り＋自動コピー）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ZXing ブラウザ版ライブラリ（UMD） -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 16px; }
    #video { width: 100%; max-width: 520px; aspect-ratio: 4/3; background: #000; border-radius: 8px; }
    #msg { margin-top: 12px; font-weight: 600; }
    .ok { color: #0a8; } .warn { color: #c60; } .err { color: #c00; }
    #tips { margin-top: 8px; font-size: .9em; opacity: .85; }
    #result { margin-top: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-family: ui-monospace,Consolas,monospace; }
    #actions { margin-top: 8px; }
    button { padding: 8px 12px; margin-right: 8px; }
    #devices { margin: 8px 0; display: none; }
  </style>
</head>
<body>
  <h2>QRをかざしてください</h2>
  <video id="video" muted playsinline></video>
  <div id="msg" class="warn">初回は「カメラ」と「クリップボード」の許可を求められます。</div>
  <div id="tips">読み取れたら毎回クリップボードに自動コピーします（失敗時は［手動でコピー］）。</div>

  <div id="devices">
    <label for="cam">カメラ選択：</label>
    <select id="cam"></select>
  </div>

  <div id="result" style="display:none"></div>
  <div id="actions">
    <button id="copyBtn">手動でコピー</button>
    <button id="stopBtn">カメラ停止</button>
  </div>

  <script>
  (async () => {
    // --- UI参照 ---
    const msg = (t, cls) => { const m = document.getElementById('msg'); m.textContent = t; m.className = cls || ''; };
    const video = document.getElementById('video');
    const resultBox = document.getElementById('result');
    const copyBtn = document.getElementById('copyBtn');
    const stopBtn = document.getElementById('stopBtn');
    const camSel = document.getElementById('cam');
    const camWrap = document.getElementById('devices');

    // --- 設定 ---
    const RESUME_DELAY_MS = 1000;     // 1件読み取ったあと再開する待ち時間
    const DUP_SUPPRESS_MS = 1200;    // この時間内に同一内容なら重複として無視
    let lastText = "";
    let lastDetectedAt = 0;
    let manuallyStopped = false;

    // --- 事前チェック ---
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      msg("HTTPSで開いてください（カメラAPIはHTTPS/localhostのみ動作）", "err");
      return;
    }
    try {
      await navigator.mediaDevices.getUserMedia({ video: true });
    } catch (e) {
      msg("カメラの許可が必要です。アドレスバーの鍵→『カメラ：許可』にしてください。", "err");
      return;
    }

    // --- ZXing 初期化 ---
    const codeReader = new ZXingBrowser.BrowserQRCodeReader();

    // --- カメラ列挙＆開始 ---
    try {
      const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
      let deviceId = null;

      if (devices && devices.length > 1) {
        // UI表示
        camWrap.style.display = 'block';
        devices.forEach((d, i) => {
          const opt = document.createElement('option');
          opt.value = d.deviceId;
          opt.textContent = d.label || `camera-${i+1}`;
          camSel.appendChild(opt);
        });
        deviceId = devices[0].deviceId;
        camSel.value = deviceId;
        camSel.onchange = () => {
          deviceId = camSel.value;
          startScan(deviceId);
        };
      }
      await startScan(deviceId); // deviceId=null なら既定カメラ
    } catch (e) {
      console.error(e);
      msg("カメラ列挙に失敗しました。別アプリがカメラ使用中の可能性があります。", "err");
      return;
    }

    // --- 連続読み取りのコア ---
    async function startScan(deviceId) {
      if (manuallyStopped) return;

      msg("カメラ起動中…", "warn");
      // 既存セッションを安全に停止
      try { codeReader.reset(); } catch(e){}
      try {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(t => t.stop());
          video.srcObject = null;
        }
      } catch(e){}

      await codeReader.decodeFromVideoDevice(deviceId, video, async (result, err, controls) => {
        if (manuallyStopped) {
          try { controls?.stop?.(); } catch(_) {}
          try { video.srcObject?.getTracks().forEach(t => t.stop()); } catch(_){}
          return;
        }

        if (result) {
          const text = result.getText();
          const now = Date.now();

          // 重複抑止（同一テキストを短時間で再検出したら捨てる）
          if (text === lastText && (now - lastDetectedAt) < DUP_SUPPRESS_MS) {
            return;
          }
          lastText = text;
          lastDetectedAt = now;

          // UI更新
          resultBox.style.display = 'block';
          resultBox.textContent = text;

          // 自動コピー
          try {
            await navigator.clipboard.writeText(text);
            msg("読み取り→コピー完了。Excelに戻らなくても次のQRをかざせます。", "ok");
          } catch (e) {
            msg("読み取り完了。ただしクリップボード書込みに失敗。［手動でコピー］を押してください。", "warn");
          }

          // いったん停止してから、短い待ち時間の後に自動再開（連続読取）
          try { controls?.stop?.(); } catch(e){}
          try { video.srcObject?.getTracks().forEach(t => t.stop()); } catch(e){}

          if (!manuallyStopped) {
            msg("次のQRを読み取る準備中…", "warn");
            setTimeout(() => startScan(deviceId), RESUME_DELAY_MS);
          }
        } else if (err && !(err instanceof ZXingBrowser.NotFoundException)) {
          // 検出以外のエラーだけログ（NotFoundException はフレームごとの未検出）
          console.error(err);
        }
      });

      msg("カメラが起動しました。QRをかざしてください。", "ok");
    }

    // --- 手動コピーの保険 ---
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(resultBox.textContent || "");
        msg("手動コピーに成功。", "ok");
      } catch (e) {
        msg("手動コピーに失敗。テキストを選択して Ctrl+C を押してください。", "err");
      }
    };

    // --- 手動停止 ---
    stopBtn.onclick = () => {
      manuallyStopped = true;
      try { video.srcObject?.getTracks().forEach(t => t.stop()); } catch(e){}
      try { codeReader.reset(); } catch(e){}
      msg("カメラを停止しました。", "warn");
    };
  })();
  </script>
</body>
</html>
